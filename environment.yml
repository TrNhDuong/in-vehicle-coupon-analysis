  - numpy=2.4.6
  - pandas=3.1.1
  - scipy=1.17.1
  - scikit-learn=1.8.0
  - matplotlib=3.11.2
  # Công cụ notebook & kiểm thử (không ảnh hưởng số liệu)
  - jupyterlab
  - notebook
  - ipykernel
  - nbformat
  - nbclient
  - nbconvert
  - pytest
  - pip
