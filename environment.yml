name: csc17104-coupon
channels:
  - conda-forge
dependencies:
  # Ghim phiên bản các thư viện tính toán để chạy lại ra ĐÚNG các con số trong notebook.
  # (Đã kiểm chứng 2026-11-28: notebook 01–02 cho kết quả trùng khớp; Q6 phụ thuộc phiên bản
  #  scikit-learn – bản 1.7.x/1.9.x chia fold/huấn luyện khác nên số liệu lệch ở chữ số thứ 3.)
